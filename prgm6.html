<html>
<head>
    <title>Javascript using String and Math function</title>
</head>
<body>
<h2>JavaScript String Object Functions</h2>
<script language="javascript">
var str1 = "Javascript Is An";
var str2 = "Interesting Language";
var str3 = "   Hello JavaScript   ";
document.write("1. First String: ", str1, "<br><br>");
document.write("2. Second String: ", str2, "<br><br>");
document.write("3. Length of the String1: ", str1.length, "<br><br>");
document.write("4. Uppercase: ", str1.toUpperCase(), "<br><br>");
document.write("5. Lowercase: ", str1.toLowerCase(), "<br><br>");
document.write("6. First Character of string1: ", str1.charAt(0), "<br><br>");
document.write("7. Last Character of string2: ", str2.charAt(str2.length - 1), "<br><br>");
document.write("8. Substring: ", str1.substring(0, 4), "<br><br>");
document.write("9. Position of v in First string: ", str1.indexOf("v"), "<br><br>");
document.write("10. Last Position of 's' in First string: ", str1.lastIndexOf("s"), "<br><br>");
document.write("11. Replace 'Javascript' into 'HTML': ", str1.replace("Javascript", "HTML"), "<br><br>");
document.write("12. Concatenation: ", str1.concat(" ", str2), "<br><br>");
document.write("13. Slice: ", str1.slice(0, 10), "<br><br>");
document.write("14. Split: ", str2.split(" "), "<br><br>");
document.write("15. Third String: ", str3, "<br><br>");
document.write("16. Trim: ", str3.trim(), "<br><br>");
</script>

<h2>JavaScript Math Object Functions</h2>
<script language="javascript">
var num = 25.6;
document.write("1. Number: ", num, "<br><br>");
document.write("2. Square Root: ", Math.sqrt(num), "<br><br>");
document.write("4. Round: ", Math.round(num), "<br><br>");
document.write("5. Ceiling: ", Math.ceil(num), "<br><br>");
document.write("6. Floor: ", Math.floor(num), "<br><br>");
document.write("3. Power(5,2): ", Math.pow(5, 2), "<br><br>");
document.write("7. Absolute Value of -25: ", Math.abs(-25), "<br><br>");
document.write("8. Maximum in (10,20,30,40): ", Math.max(10, 20, 30, 40), "<br><br>");
document.write("9. Minimum in (10,20,30,40): ", Math.min(10, 20, 30, 40), "<br><br>");
document.write("10. Random Number: ", Math.random(), "<br><br>");
</script>

</body>
</html>
